name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -count=1 ./...

  race:
    name: race (ubuntu, cgo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: test with race detector
        run: go test -race -count=1 ./...

  wasm:
    name: wasm (js, node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: build
        run: GOOS=js GOARCH=wasm go build ./...
      - name: test under Node
        run: |
          printf '#!/bin/sh\nexec node "$(go env GOROOT)/lib/wasm/wasm_exec_node.js" "$@"\n' > /tmp/wasm_exec.sh
          chmod +x /tmp/wasm_exec.sh
          GOOS=js GOARCH=wasm go test -exec=/tmp/wasm_exec.sh -count=1 ./...

  format:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
